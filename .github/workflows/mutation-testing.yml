name: Mutation Testing

# Mutation testing takes minutes, so it runs on a schedule instead of in
# pnpm check. It fails when the score drops below thresholds.break in
# stryker.config.mjs. The maintainer owns it; CONTRIBUTING.md (Tests) has the
# steps for a failed run.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # A change to the mutation setup runs before it merges.
  pull_request:
    paths:
      - .github/workflows/mutation-testing.yml
      - stryker.config.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation score

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests
        run: pnpm mutation
