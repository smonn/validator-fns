name: Pull Request Description

on:
  # edited re-runs the check when the description changes, without re-running
  # the full check in continuous-integration.yml.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  decisions:
    name: decisions answered

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The description goes through an environment variable, never into the
      # script text, so its content can't run as shell.
      - name: Check for open decisions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-decisions.mjs
