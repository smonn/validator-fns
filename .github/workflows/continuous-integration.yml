name: Continuous Integration

on:
  push:
    branches:
      - main
      - next
  # Every PR, including one stacked on another PR's branch, gets checked.
  pull_request:

jobs:
  build:
    name: check and build

    runs-on: ubuntu-latest

    env:
      # Standing scope: two kinds of PR skip the changeset check.
      # - Dependabot PRs. The library has no runtime dependencies, so their
      #   changeset would always be empty, and pushing one onto the branch stops
      #   Dependabot from rebasing it. Keyed on the PR author, which nobody else
      #   can use. Revisit if the library takes a runtime dependency.
      # - The Version Packages PR. It consumes the changesets it releases, so the
      #   check always fails on it. Keyed on a changeset-release/* branch in this
      #   repository, which only maintainers can push.
      CHANGESET_SCOPE: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/')) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The changeset check diffs against the PR's base branch.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # engines.node claims >=18, so the packed package is also loaded on the
      # lowest version it claims. Set up Node 18 first and keep its path, so the
      # .nvmrc version set up next stays first on PATH for the tooling.
      # Update this with engines.node.
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Record the Node.js 18 path
        run: echo "NODE_18=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        if: env.CHANGESET_SCOPE != 'true'
        run: pnpm check

      - name: Check without the changeset (standing scope)
        if: env.CHANGESET_SCOPE == 'true'
        run: pnpm check:code

      # Runs after Check, which builds dist. The script packs and installs with
      # the .nvmrc tooling, then loads the package with the Node it runs on.
      - name: Smoke test on Node.js 18
        run: '"$NODE_18" scripts/smoke-test.mjs'

      - name: Build
        run: pnpm build

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
