name: Bug report
description: Something in validator-fns doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: validator-fns version
      description: From `npm ls validator-fns`.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js or browser version
      placeholder: Node.js 22.11.0, or Firefox 131
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the bug, or a link to a repository with it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full error message, if any.
    validations:
      required: true
